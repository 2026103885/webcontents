<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>설문지</title>

    <style>
        body {
            background-color: aliceblue;
        }

        h1 {
            color: brown;
            text-align: center;
        }

        p {
            font-family: "휴먼편지체";
            font-size: 1em;
            text-indent: 1em;
        }

        form {
            background-color: pink;
            padding: 10px;
        }

        footer {
            background-color: orange;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <header>
        <h1>설문지</h1>

        <p>
            소프트웨어 기술에 대한 의견을 듣습니다. 많은 참여 부탁드립니다.
        </p>

        <hr>
    </header>

    <section>

        <form>
            <p>
                학년
                <label><input type="radio" name="grade" value="1학년" checked> 1학년</label>
                <label><input type="radio" name="grade" value="2학년"> 2학년</label>
                <label><input type="radio" name="grade" value="3학년"> 3학년</label>
            </p>

            <p>
                성별
                <label><input type="radio" name="gender" value="남"> 남</label>
                <label><input type="radio" name="gender" value="여"> 여</label>
            </p>

            <p>
                관심 분야
                <select name="interest">
                    <option value="mobile">모바일 소프트웨어</option>
                    <option value="web">웹 서비스</option>
                    <option value="ai">인공지능</option>
                    <option value="game">게임</option>
                </select>
            </p>

            <p>
                진로
                <label><input type="checkbox" name="job" value="개발" checked> 개발</label>
                <label><input type="checkbox" name="job" value="기획"> 기획</label>
                <label><input type="checkbox" name="job" value="영업"> 영업</label>
                <label><input type="checkbox" name="job" value="창업"> 창업</label>
            </p>

            <p>
                남기고 싶은 말
                <textarea cols="45" rows="7" placeholder="글을 남겨주세요"></textarea>
            </p>
        </form>

    </section>

    <footer>
        <p>Copyright 2026 by MYONGJI COLLEGE</p>
    </footer>

</body>

</html>
