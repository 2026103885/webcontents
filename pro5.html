<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>도형 서식 폼 만들기</title>        
    </head>
    <body>
        <h3>도형 서식 폼 만들기</h3>
        <hr>
        <form>
            <field set>
                <legend>도형 서식 입력
                     <selectname="선종류">
                        <option value="1">선없음</option>
                        <option value="2">실선</option>
                        <option value="3">점선</option>
                     </select>
                    선 두께<input type="number"min="0.0" max="10.0" step="0.5">
                    선 색 <input type="color" value="00BFFF"
                    onchange="document.body.style.color=this.value">
                    투명도 <input type ="range"min="0"max="100">
                </legend>
                
            </field>
            
    </body>
</html>
